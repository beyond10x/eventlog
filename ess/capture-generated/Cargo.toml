[package]
name = "eventlog-capture-types"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "types.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }

[features]
default = ["exact-numbers"]
exact-numbers = ["serde_json/arbitrary_precision"]

[workspace]
