domain: eventlog.admission
entities:
  - name: eventlog.admission.ScopeCounter
    identity:
      name: coordinate
      type: String
    fields:
      - name: held
        type: Integer
    lifecycle:
      initial: Present
      states: [Present]
      terminal: [Present]
    # coordinate is the injective length-prefixed encoding of kind (t tenant admission,
    # d deployment admission, q tenant sequence), exact tenant when applicable and scope key.
    # held is nonnegative. Admission changes with an append receipt; a sequence changes only
    # with a successful caller transaction. The q tag cannot address a t/d admission counter.
    # No business ownership, caller authority, or lifecycle membership is asserted here.
  - name: eventlog.admission.ProjectionRegistration
    identity:
      name: projection_name
      type: String
    fields:
      - name: indexed_fields
        type: List<String>
      - name: document_queries
        type: Boolean
    lifecycle:
      initial: Present
      states: [Present]
      terminal: [Present]
    # Exact logical projection shape within one owner schema; no wildcard table ownership.
    # Legacy array roster encoding implies document_queries=false. Extended object encoding
    # stores indexed_fields as fields and document_queries as documents=true.
