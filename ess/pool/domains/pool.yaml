domain: eventlog.pool

# A transient, in-process observation of one bounded connection pool. No persistent entity,
# lifecycle, event or domain concept is introduced; values reset with the pool.
types:
  - name: eventlog.pool.PoolChurn
    kind: struct
    fields:
      - name: opened
        type: Integer
      - name: replacements
        type: Integer
      - name: retired_unsettled_lease
        type: Integer
      - name: retired_closed_client
        type: Integer
      - name: retired_shutdown
        type: Integer
    invariants:
      - opened >= 0
      - replacements >= 0
      - retired_unsettled_lease >= 0
      - retired_closed_client >= 0
      - retired_shutdown >= 0
      - replacements <= opened
    # Monotonic counts since the pool was created. opened counts every successful connect.
    # A retirement is a connection the pool closed instead of keeping idle, counted once at the
    # decision, by cause: a lease dropped without settling, a client already closed (on return
    # or found idle at checkout), or pool shutdown (shutdown takes precedence over the others).
    # A connect is a replacement when, as it completes, earlier non-shutdown retirements exceed
    # earlier replacements; every other connect only fills capacity the pool never had open.
    # Also replacements <= retired_unsettled_lease + retired_closed_client, which ESS invariants
    # cannot state (no sum of two facts). Rust refines each count to u64.
    # A connection retired for any cause is closed when its lease is dropped, synchronously, on
    # the dropping thread: the transport the driver owns is released before the drop returns,
    # whatever runtime the caller runs and whether or not that runtime is polled again. The
    # server therefore sees the session end (and rolls back an open transaction) at once,
    # instead of keeping it idle in transaction until its own timeout. Capacity is still
    # returned only after the retirement is accounted.
  - name: eventlog.pool.TimedOutWrite
    kind: enum
    variants: [deadline, unknown_commit]
    # What a caller of a PostgreSQL append (single, guarded, atomic group, atomic group with
    # blobs) receives when the store operation's deadline fires before the outcome is known.
    # deadline: COMMIT was never written to the connection, so the transaction did not commit
    # and the caller may retry. unknown_commit: COMMIT was written and its reply was not read,
    # so the caller resolves the same durable command identity before retrying. Rust maps
    # these to EventLogError::Deadline and EventLogError::UnknownCommit.
