[package]
name = "eventlog-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
eventlog-core.workspace = true
# `serialize` writes and reads a whole in-memory database, so a tree store reopens without a replay.
rusqlite = { workspace = true, features = ["serialize"] }
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
rusqlite.workspace = true
eventlog-conformance.workspace = true
serde.workspace = true
time.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["fs"] }

[lints]
workspace = true
