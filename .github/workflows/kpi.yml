name: KPI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpi-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  counters:
    name: KPI counters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --cpus 2 --memory 1g --pids-limit 256
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      EVENTLOG_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kpi-runner
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the KPI runner
        run: cargo build --release --locked -p eventlog-kpi --features counters
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            target/release/eventlog-kpi ci-scope --base "$BASE" --head HEAD
          fi
      - name: Counters against kpi/baseline.json
        if: steps.scope.outputs.run == 'true'
        run: bash scripts/gate.sh --kpi

  timing:
    name: KPI timing
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --cpus 2 --memory 1g --pids-limit 256
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      EVENTLOG_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kpi-runner
          save-if: false
      - name: Build the KPI runner
        run: cargo build --release --locked -p eventlog-kpi --features counters
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            target/release/eventlog-kpi ci-scope --base "$BASE" --head HEAD
          fi
      - name: Timing A/B against the pull request base
        if: steps.scope.outputs.run == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cp target/release/eventlog-kpi "$RUNNER_TEMP/eventlog-kpi"
          "$RUNNER_TEMP/eventlog-kpi" ab --base "$BASE" --head HEAD
