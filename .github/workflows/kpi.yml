name: KPI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Timing A/B base revision (a sha or tag); empty skips the timing job
        required: false
        default: ''
      head:
        description: Timing A/B head revision; the base again gives an A/A run
        required: false
        default: HEAD
      rounds:
        description: Interleaved rounds per side; empty takes kpi/kpis.json's value
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: kpi-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request of planning or prose only (scripts/ci-paths.sh) builds no KPI runner. The Scope
  # steps below narrow further: no Markdown file moves a counter.
  classify:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Planning, prose, site or code
        id: paths
        run: sh scripts/ci-paths.sh pull-request

  counters:
    name: KPI counters
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --cpus 2 --memory 1g --pids-limit 256
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      EVENTLOG_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kpi-runner
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the KPI runner
        run: cargo build --release --locked -p eventlog-kpi --features counters
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            target/release/eventlog-kpi ci-scope --base "$BASE" --head HEAD
          fi
      - name: Counters against kpi/baseline.json
        if: steps.scope.outputs.run == 'true'
        run: bash scripts/gate.sh --kpi
      - name: Slow lane, the release-build wall-clock budgets
        if: steps.scope.outputs.run == 'true'
        run: bash scripts/gate.sh --slow

  timing:
    name: KPI timing
    needs: classify
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.classify.outputs.code != 'false') || (github.event_name == 'workflow_dispatch' && inputs.base != '')) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --cpus 2 --memory 1g --pids-limit 256
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      EVENTLOG_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kpi-runner
          save-if: false
      - name: Build the KPI runner
        run: cargo build --release --locked -p eventlog-kpi --features counters
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            target/release/eventlog-kpi ci-scope --base "$BASE" --head HEAD
          fi
      - name: Timing A/B against the pull request base, or the dispatched revisions
        if: steps.scope.outputs.run == 'true'
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
          HEAD_REV: ${{ inputs.head || 'HEAD' }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          cp target/release/eventlog-kpi "$RUNNER_TEMP/eventlog-kpi"
          nproc
          cat /proc/loadavg
          set -- ab --base "$BASE" --head "$HEAD_REV"
          if [ -n "$ROUNDS" ]; then set -- "$@" --rounds "$ROUNDS"; fi
          "$RUNNER_TEMP/eventlog-kpi" "$@"
          cat /proc/loadavg
