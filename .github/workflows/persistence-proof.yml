name: Persistence proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --cpus 2 --memory 1g --pids-limit 256
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      EVENTLOG_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
      EVENTLOG_TEST_HOSTED_POSTGRES_URL: postgresql://eventlog_test_application@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate
      - name: Check out immutable original adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 20e00c1eeab5d67bd5f749bbbd871b1fbfe7f796
          path: baseline
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure disposable verified TLS fixture
        run: cargo run --locked -p eventlog-postgres --example production-fixture -- --container '${{ job.services.postgres.id }}' --directory '${{ runner.temp }}/eventlog-proof-tls'
      - name: Required PostgreSQL and SQLite conformance, formatter and linter
        env:
          EVENTLOG_TEST_POSTGRES_CA: ${{ runner.temp }}/eventlog-proof-tls/ca.crt
          EVENTLOG_PROOF_REPORT: ${{ runner.temp }}/eventlog-proof.json
          EVENTLOG_PROOF_RAW: ${{ runner.temp }}/eventlog-proof-raw.log
        run: bash scripts/gate.sh --production-proof
      - name: Required comparative envelope and restart replay
        run: cargo run --locked -p eventlog-postgres --example comparative-proof -- --baseline ../baseline --container '${{ job.services.postgres.id }}' --output '${{ runner.temp }}/eventlog-comparison'
      - name: Preserve exact proof output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: persistence-proof
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/eventlog-proof.json
            ${{ runner.temp }}/eventlog-proof-raw.log
            ${{ runner.temp }}/eventlog-comparison/
          if-no-files-found: error
