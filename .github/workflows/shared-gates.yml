name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@547c6bc58d734e679f21bdeeb365f7dcc88059b1
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
