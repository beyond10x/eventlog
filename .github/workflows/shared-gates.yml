name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@2c3c6acd0a6795768446e925a6137e17357f267a
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
