name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@4317ac7561e7307a6426212f1929b6a8259fc915
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
