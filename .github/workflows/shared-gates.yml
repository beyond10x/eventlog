name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@fcf578f1b6bca26ffc153f019092df29acb97b0c
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
