nextest-version = { required = "0.9.143" }

[profile.default]
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }
fail-fast = false
final-status-level = "slow"

[profile.default.junit]
path = "junit.xml"

[[profile.default.overrides]]
filter = "binary_id(eventlog-postgres::conformance) | binary_id(eventlog-postgres::runtime_context)"
threads-required = "num-test-threads"
