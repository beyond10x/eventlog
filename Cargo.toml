[workspace]
members = [
    "crates/eventlog-core",
    "crates/eventlog-sqlite",
    "crates/eventlog-postgres",
    "crates/eventlog-conformance",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/eventlog"
homepage = "https://github.com/beyond10x/eventlog"
rust-version = "1.91"
version = "0.1.0"
publish = false

[workspace.dependencies]
clap = {version="=4.6.6",features=["derive"]}
eventlog-core = { path = "crates/eventlog-core" }
eventlog-sqlite = { path = "crates/eventlog-sqlite" }
eventlog-postgres = { path = "crates/eventlog-postgres" }
eventlog-conformance = { path = "crates/eventlog-conformance" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
