[workspace]
members = [
    "crates/eventlog-core",
    "crates/eventlog-sqlite",
    "crates/eventlog-postgres",
    "crates/eventlog-conformance",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Daemonloom-Proprietary"
repository = "https://github.com/daemonloom/daemonloom"
homepage = "https://github.com/daemonloom/daemonloom/tree/main/foundation/eventlog"
rust-version = "1.91"
version = "0.1.0-dev.1"
publish = false

[workspace.dependencies]
eventlog-core = { path = "crates/eventlog-core" }
eventlog-sqlite = { path = "crates/eventlog-sqlite" }
eventlog-postgres = { path = "crates/eventlog-postgres" }
eventlog-conformance = { path = "crates/eventlog-conformance" }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
